<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D2"/>
      <stop offset="40%" stop-color="#F7D784"/>
      <stop offset="100%" stop-color="#C9882B"/>
    </linearGradient>
    <linearGradient id="plateDark3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1107"/>
      <stop offset="100%" stop-color="#0A0603"/>
    </linearGradient>
    <linearGradient id="rimGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB97" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#583714" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Obsidian Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#plateDark3)" stroke="url(#rimGrad3)" stroke-width="1.5"/>
  <rect x="7" y="7" width="86" height="86" rx="23" fill="none" stroke="url(#goldGrad3)" stroke-width="0.75" opacity="0.25"/>

  <!-- Geometric Route Star & Navigation Beacon -->
  <g transform="translate(50, 50)">
    <!-- Orbital Waypoint Ring -->
    <circle cx="0" cy="0" r="27" fill="none" stroke="url(#goldGrad3)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.45"/>
    
    <!-- 8-Point Route Beacon (✦ Motif) -->
    <path d="M 0 -29 L 5.5 -10 L 25 -25 L 10 -5.5 L 29 0 L 10 5.5 L 25 25 L 5.5 10 L 0 29 L -5.5 10 L -25 25 L -10 5.5 L -29 0 L -10 -5.5 L -25 -25 L -5.5 -10 Z" 
          fill="url(#goldGrad3)" filter="url(#glow3)"/>
          
    <!-- Central Waypoint Core -->
    <circle cx="0" cy="0" r="6" fill="#140C06" stroke="url(#goldGrad3)" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFF8DE"/>
  </g>
</svg>
