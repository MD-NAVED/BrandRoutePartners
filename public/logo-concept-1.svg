<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D2"/>
      <stop offset="40%" stop-color="#F7D784"/>
      <stop offset="100%" stop-color="#C9882B"/>
    </linearGradient>
    <linearGradient id="plateDark1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1107"/>
      <stop offset="100%" stop-color="#0A0603"/>
    </linearGradient>
    <linearGradient id="rimGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB97" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#583714" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Obsidian Squircle Base -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#plateDark1)" stroke="url(#rimGrad1)" stroke-width="1.5"/>
  <rect x="7" y="7" width="86" height="86" rx="23" fill="none" stroke="url(#goldGrad1)" stroke-width="0.75" opacity="0.25"/>

  <!-- Architectural 'B-Route' Monogram -->
  <g transform="translate(28, 22)">
    <!-- Vertical Spine / Foundation Anchor -->
    <rect x="0" y="0" width="8" height="56" rx="4" fill="url(#goldGrad1)"/>
    
    <!-- Upper Route Loop (Brand) -->
    <path d="M 8 3 L 23 3 C 33 3, 38 9, 38 17 C 38 25, 33 29, 23 29 L 8 29" 
          fill="none" stroke="url(#goldGrad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Lower Route Loop (Route) - slightly extended forward with route momentum -->
    <path d="M 8 27 L 26 27 C 37 27, 43 34, 43 43 C 43 51, 36 55, 26 55 L 8 55" 
          fill="none" stroke="url(#goldGrad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- Route Waypoint Nodes (Luminous Pearls) -->
    <circle cx="23" cy="16" r="3.5" fill="#FFF8DE" filter="url(#glow1)"/>
    <circle cx="26" cy="41" r="3.5" fill="#FFF8DE" filter="url(#glow1)"/>
  </g>
</svg>
